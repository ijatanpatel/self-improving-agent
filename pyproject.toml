[project]
name = "self-improving-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "arize-phoenix>=21.0.0",
    "arize-phoenix-client>=3.6.0",
    "arize-phoenix-otel>=0.17.2",
    "deepeval>=4.3.2",
    "numpy>=2.5.4",
    "openai>=3.41.0",
    "openinference-instrumentation-openai>=0.1.68",
    "openinference-semantic-conventions>=0.1.43",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
